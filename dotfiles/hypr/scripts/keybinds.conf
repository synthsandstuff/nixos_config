$mod=SUPER
$mod_shft=SUPER_SHIFT
bind=$mod, Q, exec, alacritty
bind=$mod, A, exec, rofi -show drun -show-icons
bind=$mod, F, exec, firefox
bind=$mod, D, exec, discord
bind=$mod, S, exec, spotify
bind=$mod, C, killactive
bind=$mod, M, exit
bind=$mod, left, movefocus, l
bind=$mod, right, movefocus, r
bind=$mod, up, movefocus, u
bind=$mod, down, movefocus, d
bind=$mod_shft, S, exec, grim -g"$(slurp)" -| swappy -f-
bindel=,XF86AudioRaiseVolume, exec, --no-startup-id pactl set-sink-volume @DEFAULT_AUDIO_SINK@ +5%
bindel=,XF86AudioLowerVolume, exec, --no-startup-id pactl set-sink-volume @DEFAULT_AUDIO_SINK@ -5%
bindl=,XF86AudioPlay, exec, --no-startup-id playerctl play-pause
bindl=,XF86AudioPrev, exec, --no-startup-id playerctl previous
bindl=,XF86AudioNext, exec, --no-startup-id playerctl next
